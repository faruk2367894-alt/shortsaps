<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111622">
  <title>PixelLab Shorts Studio Pro</title>
  <!-- Roboto, Montserrat, Poppins, Oswald ইত্যাদি ক্লিন ফন্ট -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;600;800;900&family=Montserrat:wght@400;600;800;900&family=Oswald:wght@600;700&family=Poppins:wght@400;600;800&family=Roboto+Condensed:wght@700&family=Roboto+Slab:wght@700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #090c13;
      color: #e2e8f0;
    }
    .app-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    /* ১. টপ বার */
    .top-bar {
      height: 46px;
      min-height: 46px;
      background: #141b27;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      border-bottom: 1px solid #202b3d;
      z-index: 20;
    }
    .top-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border-radius: 6px;
    }
    .top-btn:active { background: #202b3d; color: #38bdf8; }
    .btn-install {
      background: #0ea5e9;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      padding: 5px 9px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-export {
      background: #10b981;
      color: #022013;
      font-size: 11px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    /* ২. ক্যানভাস এরিয়া */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070c;
      overflow: hidden;
      padding: 4px;
      position: relative;
    }
    .canvas-container {
      height: 100%;
      max-height: 100%;
      aspect-ratio: 9 / 16;
      background: repeating-conic-gradient(#161e2b 0% 25%, #0e141f 0% 50%) 50% / 16px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      position: relative;
      border: 1px solid #233045;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* ৩. বটম প্যানেল */
    .bottom-panel {
      min-height: 96px;
      background: #121824;
      border-top: 1px solid #1f2a3c;
      display: flex;
      flex-direction: column;
      z-index: 20;
      flex-shrink: 0;
    }
    .sub-tools {
      height: 48px;
      padding: 4px 8px;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #151d2c;
      border-bottom: 1px solid #1e293b;
    }
    .sub-tools::-webkit-scrollbar { display: none; }
    .tool-item {
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      font-size: 8.5px;
      color: #94a3b8;
      font-weight: 800;
    }
    .tool-item input[type="range"] {
      width: 80px;
      accent-color: #38bdf8;
    }
    .tool-item select, .tool-item input[type="color"] {
      background: #0a0e17;
      border: 1px solid #2b394e;
      color: #fff;
      padding: 3px;
      border-radius: 4px;
      font-size: 9.5px;
    }
    .main-tabs {
      height: 48px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #0e141f;
    }
    .tab-btn {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 800;
      gap: 1px;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-top: 2px solid #38bdf8;
      background: #151d2a;
    }

    /* টেক্সট এডিটর মডাল */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-card {
      width: 100%;
      max-width: 400px;
      background: #161e2e;
      border: 1px solid #2b3a54;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 130px;
      background: #090d14;
      border: 1px solid #25334a;
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      font-size: 12px;
      resize: none;
    }

    /* ৪. ক্রপ স্টুডিও পপআপ */
    #cropModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      z-index: 150;
      padding: 8px;
    }
    .crop-topbar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a374f;
      padding: 0 4px;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 900;
    }
    .crop-workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin: 8px 0;
      touch-action: none;
    }
    #cropCanvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 0 25px rgba(0,0,0,0.9);
      touch-action: none;
    }
    .crop-bottombar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0;
    }
    .crop-pill {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .crop-pill.active {
      background: #0ea5e9;
      color: #fff;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="app-root">
    <!-- টপবার -->
    <div class="top-bar">
      <div class="top-icons">
        <button class="top-btn" onclick="openTextEditor()" title="Edit Text">✏️</button>
        <label class="top-btn" title="Add Image">
          ➕<input type="file" id="imageInput" accept="image/*" style="display:none">
        </label>
        <button class="top-btn" onclick="deleteImage()" title="Delete Image">🗑️</button>
        <button class="top-btn" onclick="restoreOriginalImage()" title="Restore">↺</button>
        <button class="top-btn" id="btnCompare" title="Before/After Compare">👁️</button>
      </div>
      <div class="top-icons">
        <button class="btn-install" onclick="showInstallHelp()">📲 INSTALL</button>
        <button class="top-btn" onclick="downloadTransparentPNG()" title="Transparent PNG">📥 PNG</button>
        <button class="btn-export" id="renderBtn" onclick="renderMotionVideo()">🎥 EXPORT</button>
      </div>
    </div>

    <!-- ক্যানভাস ওয়ার্কস্পেস -->
    <div class="workspace">
      <div class="canvas-container" id="canvasBox">
        <canvas id="shortsCanvas" width="1080" height="1920"></canvas>
      </div>
    </div>

    <!-- বটম কন্ট্রোল প্যানেল -->
    <div class="bottom-panel">
      <div class="sub-tools" id="subToolsBar"></div>
      <div class="main-tabs">
        <button class="tab-btn active" onclick="switchTab('text')">🔤 Text</button>
        <button class="tab-btn" onclick="switchTab('image')">🖼️ Image</button>
        <button class="tab-btn" onclick="switchTab('crop')">✂️ Crop/Cut</button>
        <button class="tab-btn" onclick="switchTab('filter')">🪄 Filter</button>
        <button class="tab-btn" onclick="switchTab('font')">🗚 Fonts</button>
        <button class="tab-btn" onclick="switchTab('motion')">🎬 Motion</button>
      </div>
    </div>
  </div>

  <!-- টেক্সট মডাল -->
  <div class="modal-overlay" id="textModal">
    <div class="modal-card">
      <span style="font-size:11px; font-weight:bold; color:#38bdf8;">EDIT SCRIPT (CASE PRESERVED)</span>
      <textarea id="modalScriptInput">Jamie Lee Curtis had a secret. For 10 years she was addicted to painkillers. She stole from friends. She forged prescriptions. She hid bottles in her car. In her purse. In her closet. Nobody suspected. Not her famous husband. Not her children. Nobody. Then a friend offered her a pill. She opened her mouth. She had said yes a thousand times before. This time she said no. She couldn't believe she'd said it. "My secret was only as sick as I was," she said. She told her husband that night. She entered rehab the next day. One word changed everything. Subscribe ❤️ if you believe one brave decision can change a life.</textarea>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeTextEditor(false)" style="padding:6px 12px; background:#334155; border:none; border-radius:6px; color:#fff; font-size:11px;">Cancel</button>
        <button onclick="closeTextEditor(true)" style="padding:6px 12px; background:#0ea5e9; border:none; border-radius:6px; color:#fff; font-size:11px;">Done</button>
      </div>
    </div>
  </div>

  <!-- কাস্টম ক্রপ স্টুডিও পপআপ -->
  <div id="cropModal">
    <div class="crop-topbar">
      <span>✂️ CROP & CUT OUT TEXT (DRAG BOX)</span>
      <div style="display:flex; gap:6px;">
        <button onclick="closeCropModal(false)" style="padding:5px 10px; background:#334155; color:#fff; border:none; border-radius:4px; font-size:10px;">CANCEL</button>
        <button onclick="closeCropModal(true)" style="padding:5px 14px; background:#22c55e; color:#000; border:none; border-radius:4px; font-weight:bold; font-size:10px;">APPLY CROP</button>
      </div>
    </div>
    <div class="crop-workspace">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="crop-bottombar">
      <button class="crop-pill active" onclick="setCropAspect('free', this)">Free-Hand Box (ইচ্ছামতো)</button>
      <button class="crop-pill" onclick="setCropAspect('head', this)">Top Half Only (নিচের টেক্সট বাদ)</button>
      <button class="crop-pill" onclick="setCropAspect('1:1', this)">1:1 Square</button>
      <button class="crop-pill" onclick="setCropAspect('9:16', this)">9:16 Full Shorts</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('shortsCanvas');
    const ctx = canvas.getContext('2d');
    let currentTab = 'text';

    let originalImg = null; 
    let loadedImg = null;
    let showBeforeComparison = false;

    let imgState = {
      x: 0, y: 0, scale: 1.0,
      cropX: 0, cropY: 0, cropW: 0, cropH: 0,
      mask: 'none', filter: 'hdr'
    };

    let textState = {
      x: 40, y: 840, w: 1000, h: 980,
      fontSize: 28, stroke: 10,
      font: "'Roboto', sans-serif",
      align: 'left',
      caseMode: 'original', // 'original' (বড়-ছোট যেমন লিখবেন), 'upper', 'sentence'
      colorDefault: '#FFFFFF', colorNum: '#FFEA00', colorName: '#38BDF8',
      rawText: document.getElementById('modalScriptInput').value
    };

    let motionState = { type: 'zoomIn', duration: 10 };
    let activeSelection = 'text';

    // ১. অ্যাপ ইনস্টলেশন গাইড (Chrome ব্রাউজার ডিটেকশন)
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function showInstallHelp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
      } else {
        alert("📲 অ্যাপ হিসেবে ইনস্টল করার নিয়ম:\n\n১. লিংকটি মেসেঞ্জার/ফেসবুক ব্রাউজারে থাকলে উপরে থ্রি-ডট (⋮) চেপে 'Open in Chrome' দিন।\n২. ক্রোম ব্রাউজারের থ্রি-ডট (⋮) মেনু থেকে 'Add to Home screen' বা 'Install app' চাপুন।");
      }
    }

    // ২. অটো-সেভ স্টেট
    function saveProjectState() {
      const stateToSave = {
        imgState: imgState,
        textState: textState,
        motionState: motionState,
        currentTab: currentTab
      };
      localStorage.setItem('pixelLabStudioState_v2', JSON.stringify(stateToSave));
    }

    function loadProjectState() {
      const saved = localStorage.getItem('pixelLabStudioState_v2');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.textState) textState = Object.assign(textState, parsed.textState);
          if (parsed.imgState) imgState = Object.assign(imgState, parsed.imgState);
          if (parsed.motionState) motionState = Object.assign(motionState, parsed.motionState);
          if (parsed.currentTab) currentTab = parsed.currentTab;
          document.getElementById('modalScriptInput').value = textState.rawText;
        } catch(e) {}
      }
      const savedImgData = localStorage.getItem('pixelLabSavedImg_v2');
      if (savedImgData) {
        const img = new Image();
        img.onload = () => {
          originalImg = img;
          loadedImg = img;
          draw();
        };
        img.src = savedImgData;
      }
    }

    // ৩. সাব-টুলস মেনু (Roboto ও কাস্টম ফন্ট ও কেস সহ)
    function renderSubTools() {
      const bar = document.getElementById('subToolsBar');
      if (currentTab === 'text') {
        bar.innerHTML = `
          <div class="tool-item"><label>SIZE</label><input type="range" min="16" max="60" value="${textState.fontSize}" oninput="textState.fontSize=parseInt(this.value); draw(); saveProjectState();"></div>
          <div class="tool-item"><label>OUTLINE</label><input type="range" min="0" max="25" value="${textState.stroke}" oninput="textState.stroke=parseInt(this.value); draw(); saveProjectState();"></div>
          <div class="tool-item"><label>TEXT CASE</label>
            <select onchange="textState.caseMode=this.value; draw(); saveProjectState();">
              <option value="original" ${textState.caseMode==='original'?'selected':''}>Normal (বড়-ছোট)</option>
              <option value="upper" ${textState.caseMode==='upper'?'selected':''}>ALL CAPS (বড়)</option>
            </select>
          </div>
          <div class="tool-item"><label>ALIGN</label>
            <select onchange="textState.align=this.value; draw(); saveProjectState();">
              <option value="left" ${textState.align==='left'?'selected':''}>Left</option>
              <option value="center" ${textState.align==='center'?'selected':''}>Center</option>
              <option value="right" ${textState.align==='right'?'selected':''}>Right</option>
            </select>
          </div>
          <div class="tool-item"><label>HIGHLIGHT</label><input type="color" value="${textState.colorNum}" onchange="textState.colorNum=this.value; draw(); saveProjectState();"></div>
        `;
      } else if (currentTab === 'image') {
        bar.innerHTML = `
          <div class="tool-item"><label>ZOOM/SCALE</label><input type="range" min="0.2" max="4.0" step="0.05" value="${imgState.scale}" oninput="imgState.scale=parseFloat(this.value); draw(); saveProjectState();"></div>
          <div class="tool-item"><label>MOVE X</label><input type="range" min="-800" max="800" value="${imgState.x}" oninput="imgState.x=parseInt(this.value); draw(); saveProjectState();"></div>
          <div class="tool-item"><label>MOVE Y</label><input type="range" min="-800" max="1000" value="${imgState.y}" oninput="imgState.y=parseInt(this.value); draw(); saveProjectState();"></div>
        `;
      } else if (currentTab === 'crop') {
        bar.innerHTML = `
          <div class="tool-item"><label>CROP TOOL</label>
            <button onclick="openCropModal()" style="padding:4px 10px; background:#0ea5e9; color:#fff; border:none; border-radius:4px; font-size:9px; font-weight:bold;">✂️ OPEN CROP BOX</button>
          </div>
          <div class="tool-item"><label>MASK EFFECT</label>
            <select onchange="imgState.mask=this.value; draw(); saveProjectState();">
              <option value="none" ${imgState.mask==='none'?'selected':''}>None</option>
              <option value="circle" ${imgState.mask==='circle'?'selected':''}>Circle</option>
              <option value="rounded" ${imgState.mask==='rounded'?'selected':''}>Rounded</option>
              <option value="fadeBottom" ${imgState.mask==='fadeBottom'?'selected':''}>Fade Bottom</option>
            </select>
          </div>
        `;
      } else if (currentTab === 'filter') {
        bar.innerHTML = `
          <div class="tool-item"><label>SMART FILTER</label>
            <select onchange="imgState.filter=this.value; draw(); saveProjectState();">
              <option value="hdr" ${imgState.filter==='hdr'?'selected':''}>Vibrant HDR (Auto-Enhance)</option>
              <option value="warm" ${imgState.filter==='warm'?'selected':''}>Warm Glow</option>
              <option value="cool" ${imgState.filter==='cool'?'selected':''}>Cool Blue</option>
              <option value="cyber" ${imgState.filter==='cyber'?'selected':''}>Cyberpunk</option>
              <option value="bw" ${imgState.filter==='bw'?'selected':''}>Noir B&W</option>
              <option value="none" ${imgState.filter==='none'?'selected':''}>Original</option>
            </select>
          </div>
        `;
      } else if (currentTab === 'font') {
        bar.innerHTML = `
          <div class="tool-item"><label>FONT SELECTION (ROBOTO & MORE)</label>
            <select onchange="textState.font=this.value; draw(); saveProjectState();">
              <option value="'Roboto', sans-serif">Roboto Clean (Standard)</option>
              <option value="'Roboto Slab', serif">Roboto Slab Bold</option>
              <option value="'Roboto Condensed', sans-serif">Roboto Condensed</option>
              <option value="'Inter', sans-serif">Inter Pro</option>
              <option value="'Poppins', sans-serif">Poppins Modern</option>
              <option value="'Montserrat', sans-serif">Montserrat</option>
              <option value="'Oswald', sans-serif">Oswald</option>
              <option value="'Anton', sans-serif">Anton Impact</option>
              <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
            </select>
          </div>
        `;
      } else if (currentTab === 'motion') {
        bar.innerHTML = `
          <div class="tool-item"><label>CAMERA MOTION</label>
            <select onchange="motionState.type=this.value; saveProjectState();">
              <option value="zoomIn" ${motionState.type==='zoomIn'?'selected':''}>Zoom In</option>
              <option value="zoomOut" ${motionState.type==='zoomOut'?'selected':''}>Zoom Out</option>
              <option value="none" ${motionState.type==='none'?'selected':''}>Static</option>
            </select>
          </div>
          <div class="tool-item"><label>DURATION</label>
            <select onchange="motionState.duration=parseInt(this.value); saveProjectState();">
              <option value="10" ${motionState.duration===10?'selected':''}>10s</option>
              <option value="12" ${motionState.duration===12?'selected':''}>12s</option>
              <option value="15" ${motionState.duration===15?'selected':''}>15s</option>
            </select>
          </div>
        `;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      activeSelection = (tab === 'image' || tab === 'crop' || tab === 'filter') ? 'image' : 'text';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.innerText.toLowerCase().includes(tab));
      if (activeBtn) activeBtn.classList.add('active');
      renderSubTools();
      draw();
      saveProjectState();
    }

    // ইমেজ আপলোড ও অটো-এনহ্যান্স
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = new Image();
          img.onload = () => {
            originalImg = img;
            loadedImg = img;
            imgState.x = 0; imgState.y = 0; imgState.scale = 1.0;
            imgState.cropX = 0; imgState.cropY = 0;
            imgState.cropW = img.width; imgState.cropH = img.height;
            switchTab('crop');
            draw();
            saveProjectState();
            try { localStorage.setItem('pixelLabSavedImg_v2', evt.target.result); } catch(err){}
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // ৪. কাস্টম ক্রপ ইঞ্জিন (স্ক্রিনশটের নিচের টেক্সট বাদ দেওয়ার টুল)
    const cropModal = document.getElementById('cropModal');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');
    let cropBox = { x: 0, y: 0, w: 200, h: 200 };
    let cropRatioMode = 'free';
    let isDraggingCrop = false;
    let isResizingCrop = false;
    let cropTouchStart = { x: 0, y: 0 };
    let cropCanvasScale = 1.0;

    function openCropModal() {
      if (!originalImg) {
        alert("অনুগ্রহ করে ➕ বাটন চেপে একটি ছবি দিন!");
        return;
      }
      cropModal.style.display = 'flex';
      setupCropCanvas();
    }

    function setupCropCanvas() {
      const maxW = window.innerWidth - 20;
      const maxH = window.innerHeight - 120;
      let w = originalImg.width;
      let h = originalImg.height;

      const scale = Math.min(maxW / w, maxH / h, 1.0);
      cropCanvas.width = w * scale;
      cropCanvas.height = h * scale;
      cropCanvasScale = scale;

      // ডিফল্টভাবে উপরের অর্ধেক সিলেক্ট থাকবে যাতে নিচের লেখা বাদ যায়
      cropBox = {
        x: 0,
        y: 0,
        w: cropCanvas.width,
        h: cropCanvas.height * 0.55 // নিচের টেক্সট ছাড়া শুধু চেহারা
      };
      drawCropView();
    }

    function setCropAspect(aspect, btn) {
      cropRatioMode = aspect;
      document.querySelectorAll('.crop-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      let w = cropCanvas.width;
      let h = cropCanvas.height;

      if (aspect === 'head') {
        // শুধু উপরের ছবি, নিচের টেক্সট স্বয়ংক্রিয় বাদ
        cropBox = { x: 0, y: 0, w: w, h: h * 0.52 };
      } else if (aspect === '1:1') {
        let s = Math.min(w, h);
        cropBox = { x: (w-s)/2, y: 0, w: s, h: s };
      } else if (aspect === '9:16') {
        let cw = Math.min(w, h * (9/16));
        cropBox = { x: (w-cw)/2, y: 0, w: cw, h: cw * (16/9) };
      }
      drawCropView();
    }

    function drawCropView() {
      cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
      cropCtx.drawImage(originalImg, 0, 0, cropCanvas.width, cropCanvas.height);

      // বাইরে অন্ধকার করা
      cropCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      cropCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);

      // ক্রপ এলাকার ভেতর একদম পরিষ্কার রাখা
      cropCtx.clearRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);
      cropCtx.drawImage(originalImg, 
        cropBox.x / cropCanvasScale, cropBox.y / cropCanvasScale, cropBox.w / cropCanvasScale, cropBox.h / cropCanvasScale,
        cropBox.x, cropBox.y, cropBox.w, cropBox.h
      );

      // বর্ডার
      cropCtx.strokeStyle = '#38bdf8';
      cropCtx.lineWidth = 2;
      cropCtx.strokeRect(cropBox.x, cropBox.y, cropBox.w, cropBox.h);

      // কোণায় হ্যান্ডেল
      cropCtx.fillStyle = '#38bdf8';
      const sz = 16;
      cropCtx.fillRect(cropBox.x + cropBox.w - sz, cropBox.y + cropBox.h - sz, sz, sz);
    }

    cropCanvas.addEventListener('pointerdown', (e) => {
      const rect = cropCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      cropTouchStart = { x, y };

      if (Math.hypot(x - (cropBox.x + cropBox.w), y - (cropBox.y + cropBox.h)) < 40) {
        isResizingCrop = true;
      } else if (x >= cropBox.x && x <= cropBox.x + cropBox.w && y >= cropBox.y && y <= cropBox.y + cropBox.h) {
        isDraggingCrop = true;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDraggingCrop && !isResizingCrop) return;
      const rect = cropCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const dx = x - cropTouchStart.x;
      const dy = y - cropTouchStart.y;

      if (isDraggingCrop) {
        cropBox.x = Math.max(0, Math.min(cropCanvas.width - cropBox.w, cropBox.x + dx));
        cropBox.y = Math.max(0, Math.min(cropCanvas.height - cropBox.h, cropBox.y + dy));
      } else if (isResizingCrop) {
        cropBox.w = Math.max(60, Math.min(cropCanvas.width - cropBox.x, cropBox.w + dx));
        cropBox.h = Math.max(60, Math.min(cropCanvas.height - cropBox.y, cropBox.h + dy));
      }
      cropTouchStart = { x, y };
      drawCropView();
    });

    window.addEventListener('pointerup', () => {
      isDraggingCrop = false;
      isResizingCrop = false;
    });

    function closeCropModal(apply) {
      if (apply) {
        imgState.cropX = cropBox.x / cropCanvasScale;
        imgState.cropY = cropBox.y / cropCanvasScale;
        imgState.cropW = cropBox.w / cropCanvasScale;
        imgState.cropH = cropBox.h / cropCanvasScale;
        draw();
        saveProjectState();
      }
      cropModal.style.display = 'none';
    }

    function deleteImage() {
      loadedImg = null; originalImg = null;
      localStorage.removeItem('pixelLabSavedImg_v2');
      draw();
      saveProjectState();
    }

    function restoreOriginalImage() {
      if (originalImg) {
        loadedImg = originalImg;
        imgState.x = 0; imgState.y = 0; imgState.scale = 1.0;
        imgState.cropX = 0; imgState.cropY = 0;
        imgState.cropW = originalImg.width; imgState.cropH = originalImg.height;
        imgState.mask = 'none'; imgState.filter = 'hdr';
        draw();
        saveProjectState();
      }
    }

    const btnCompare = document.getElementById('btnCompare');
    btnCompare.addEventListener('pointerdown', () => { showBeforeComparison = true; draw(); });
    window.addEventListener('pointerup', () => { if (showBeforeComparison) { showBeforeComparison = false; draw(); } });

    // টাচ ও পিঞ্চ জুম
    const canvasBox = document.getElementById('canvasBox');
    let isInteracting = false, isPinching = false;
    let touchStartDist = 0, initialScale = 1.0;
    let dragStartX = 0, dragStartY = 0;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    canvasBox.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialScale = imgState.scale;
      } else if (e.touches.length === 1) {
        const p = getCoords(e);
        dragStartX = p.x; dragStartY = p.y;
        isInteracting = true;
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (isPinching && e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        imgState.scale = Math.max(0.2, Math.min(4.0, initialScale * (dist / touchStartDist)));
        draw();
        e.preventDefault();
      } else if (isInteracting && e.touches.length === 1) {
        const p = getCoords(e);
        const dx = p.x - dragStartX;
        const dy = p.y - dragStartY;
        if (activeSelection === 'text') { textState.x += dx; textState.y += dy; }
        else { imgState.x += dx; imgState.y += dy; }
        dragStartX = p.x; dragStartY = p.y;
        draw();
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (isInteracting || isPinching) saveProjectState();
      isInteracting = false;
      isPinching = false;
    });

    function openTextEditor() {
      document.getElementById('modalScriptInput').value = textState.rawText;
      document.getElementById('textModal').style.display = 'flex';
    }
    function closeTextEditor(save) {
      if (save) {
        textState.rawText = document.getElementById('modalScriptInput').value;
        draw();
        saveProjectState();
      }
      document.getElementById('textModal').style.display = 'none';
    }

    // স্মার্ট কালার ও কেস পার্সিং
    function parseStoryWords(text) {
      let cleanText = text;
      if (textState.caseMode === 'upper') cleanText = text.toUpperCase();

      const words = cleanText.trim().split(/\s+/);
      const ignore = ['The','And','For','Was','His','Her','With','From','That','Then','When','They','This','Into','Over'];
      return words.map(w => {
        let clean = w.replace(/[^a-zA-Z0-9$]/g, '');
        let col = textState.colorDefault;
        if (/(\$|\b\d+[\d,]*\b)/.test(clean)) col = textState.colorNum;
        else if (clean.length > 2 && !ignore.includes(clean) && /^[A-Z]/.test(clean)) col = textState.colorName;
        return { text: w, color: col };
      });
    }

    function getFilterCSS() {
      if (showBeforeComparison) return 'none';
      switch (imgState.filter) {
        case 'hdr': return 'contrast(135%) saturate(145%) brightness(106%)';
        case 'warm': return 'sepia(25%) saturate(135%) contrast(115%)';
        case 'cool': return 'hue-rotate(185deg) contrast(120%) saturate(120%)';
        case 'cyber': return 'hue-rotate(305deg) contrast(140%) saturate(160%)';
        case 'bw': return 'grayscale(100%) contrast(150%) brightness(95%)';
        default: return 'none';
      }
    }

    function draw(scaleMotion = 1.0, motionOffsetY = 0, renderUI = true) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ১. ক্রপ করা ইমেজ আল্ট্রা ক্লিয়ারিটি সহ আঁকা
      if (loadedImg) {
        ctx.save();
        if (imgState.mask === 'circle') {
          ctx.beginPath();
          ctx.arc(canvas.width / 2, 450, 380, 0, Math.PI * 2);
          ctx.clip();
        } else if (imgState.mask === 'rounded') {
          ctx.beginPath();
          ctx.roundRect(50, 60, canvas.width - 100, 800, 40);
          ctx.clip();
        }

        ctx.filter = getFilterCSS();
        let sx = imgState.cropX, sy = imgState.cropY;
        let sw = imgState.cropW, sh = imgState.cropH;
        let dw = canvas.width * imgState.scale * scaleMotion;
        let dh = (sh / sw) * dw;
        let dx = (canvas.width - dw) / 2 + imgState.x;
        let dy = imgState.y + motionOffsetY;

        ctx.drawImage(loadedImg, sx, sy, sw, sh, dx, dy, dw, dh);
        ctx.restore();

        if (imgState.mask === 'fadeBottom') {
          let fade = ctx.createLinearGradient(0, 0, 0, canvas.height);
          fade.addColorStop(0, 'rgba(0,0,0,0.15)');
          fade.addColorStop(0.45, 'rgba(0,0,0,0.02)');
          fade.addColorStop(0.68, 'rgba(9,12,19,0.85)');
          fade.addColorStop(1, 'rgba(9,12,19,1)');
          ctx.fillStyle = fade;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      // ২. টেক্সট প্লেট
      ctx.fillStyle = 'rgba(11, 17, 32, 0.82)';
      ctx.beginPath();
      ctx.roundRect(textState.x, textState.y, textState.w, textState.h, 24);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // ৩. টেক্সট ড্রয়িং (বড়-ছোট অক্ষরের সাপোর্ট সহ)
      const fSize = textState.fontSize;
      const sWidth = textState.stroke;
      const words = parseStoryWords(textState.rawText);

      ctx.font = `700 ${fSize}px ${textState.font}`;
      ctx.textBaseline = 'top';

      const padX = 35;
      const maxW = textState.w - (padX * 2);
      const lineH = fSize * 1.45;

      let lines = [], curLine = [], curLineWidth = 0;
      words.forEach(item => {
        const wStr = item.text + ' ';
        const wWidth = ctx.measureText(wStr).width;
        if (curLineWidth + wWidth > maxW) {
          lines.push(curLine);
          curLine = [item];
          curLineWidth = wWidth;
        } else {
          curLine.push(item);
          curLineWidth += wWidth;
        }
      });
      if (curLine.length > 0) lines.push(curLine);

      let curY = textState.y + 25;
      lines.forEach(line => {
        if (curY + lineH > textState.y + textState.h - 15) return;
        const lineTotalW = line.reduce((sum, item) => sum + ctx.measureText(item.text + ' ').width, 0);
        let curX = textState.x + padX;
        if (textState.align === 'center') curX = textState.x + (textState.w - lineTotalW) / 2;
        else if (textState.align === 'right') curX = textState.x + textState.w - padX - lineTotalW;

        line.forEach(item => {
          const wStr = item.text + ' ';
          const wWidth = ctx.measureText(wStr).width;
          if (sWidth > 0) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = sWidth;
            ctx.lineJoin = 'round';
            ctx.strokeText(wStr, curX, curY);
          }
          ctx.shadowColor = 'rgba(0,0,0,0.95)';
          ctx.shadowBlur = 8;
          ctx.fillStyle = item.color;
          ctx.fillText(wStr, curX, curY);
          curX += wWidth;
        });
        curY += lineH;
      });
      ctx.shadowBlur = 0;

      if (renderUI && activeSelection === 'text') {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(textState.x - 4, textState.y - 4, textState.w + 8, textState.h + 8);
        ctx.setLineDash([]);
      }
    }

    function downloadTransparentPNG() {
      draw(1.0, 0, false);
      const a = document.createElement('a');
      a.download = `Shorts_Overlay_${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
      draw();
    }

    async function renderMotionVideo() {
      if (!loadedImg) {
        alert("অনুগ্রহ করে ➕ চেপে ছবি দিন!");
        return;
      }
      const btn = document.getElementById('renderBtn');
      btn.disabled = true;
      btn.innerText = "...";

      const duration = motionState.duration;
      const fps = 30;
      const totalFrames = duration * fps;

      const stream = canvas.captureStream(fps);
      let mime = 'video/webm;codecs=vp9';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Motion_Video_${Date.now()}.webm`;
        a.click();
        btn.disabled = false;
        btn.innerText = "🎥 EXPORT";
        draw();
      };

      recorder.start();
      for (let f = 0; f < totalFrames; f++) {
        const p = f / totalFrames;
        let scale = 1.0, offsetY = 0;
        if (motionState.type === 'zoomIn') {
          scale = 1.0 + (p * 0.20);
          offsetY = - (p * 35);
        } else if (motionState.type === 'zoomOut') {
          scale = 1.20 - (p * 0.20);
          offsetY = - (35 - (p * 35));
        }
        draw(scale, offsetY, false);
        await new Promise(r => setTimeout(r, 1000 / fps));
      }
      recorder.stop();
    }

    window.onload = () => {
      loadProjectState();
      renderSubTools();
      draw();
    };
  </script>
</body>
