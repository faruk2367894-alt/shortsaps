<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shorts Video Style Text Editor</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1115;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* মোবাইল টপ বার */
    .top-bar {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      background: #161922;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid #282e3d;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .top-bar::-webkit-scrollbar { display: none; }

    .btn {
      background: #232936;
      color: #fff;
      border: 1px solid #3d465c;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
    }
    .btn:active { background: #353e54; }
    input[type="file"] { display: none; }

    /* অটো-সেভ টোস্ট */
    #save-tag {
      position: absolute;
      top: 55px;
      right: 12px;
      background: rgba(0, 240, 255, 0.9);
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 20px;
      display: none;
      z-index: 99;
    }

    /* ওয়ার্কস্পেস */
    .workspace {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      touch-action: none;
    }

    #capture-area {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
    }

    #image {
      max-width: 95vw;
      max-height: 52vh;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    /* ভিডিওর মতো সলিড বক্স + ডুয়েল কালার ফন্ট */
    .caption-box {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      text-align: center;
      z-index: 20;
      cursor: move;
      user-select: none;
      touch-action: none;
      line-height: 1.5;
    }
    
    .caption-box span {
      display: inline;
      background: rgba(0, 0, 0, 0.88);
      padding: 3px 6px;
      margin: 2px 0;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    /* ভিডিওর কালার স্কিম */
    .caption-box span.c-white {
      color: #ffffff;
      text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
    }
    .caption-box span.c-cyan {
      color: #00f0ff; /* রেফারেন্স ভিডিওর উজ্জ্বল সায়ান কালার */
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    /* মোবাইল কন্ট্রোল প্যানেল */
    .bottom-panel {
      background: #161922;
      border-top: 1px solid #282e3d;
      padding: 10px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    textarea {
      flex: 1;
      height: 48px;
      background: #0f1115;
      border: 1px solid #2e3547;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      resize: none;
    }
    textarea:focus { outline: none; border-color: #00f0ff; }

    .control-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .control-row::-webkit-scrollbar { display: none; }

    select {
      flex: 1;
      min-width: 120px;
      background: #0f1115;
      color: #fff;
      border: 1px solid #2e3547;
      border-radius: 6px;
      padding: 6px;
      font-size: 12px;
      height: 36px;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #aaa;
    }
    input[type="range"] {
      width: 75px;
      accent-color: #00f0ff;
    }
  </style>
</head>
<body>

  <div id="save-tag">✓ সংরক্ষিত</div>

  <div class="top-bar">
    <label class="btn">📂 ছবি আনুন <input type="file" id="file-input" accept="image/*"></label>
    <button class="btn" onclick="startCrop('free')">কাস্টম Crop</button>
    <button class="btn" onclick="startCrop(9/16)">9:16 Shorts</button>
    <button class="btn" onclick="applyCrop()" id="crop-apply-btn" style="display:none; background:#00897b;">Apply Crop</button>
    <button class="btn" onclick="saveAsImage()" style="background:#0277bd;">💾 ইমেজ সেভ</button>
    <button class="btn" onclick="deleteImage()">🗑️ ডিলিট</button>
    <button class="btn" onclick="clearAllData()" style="background:#b71c1c;">সব ক্লিয়ার</button>
  </div>

  <div class="workspace">
    <div id="capture-area">
      <img id="image" src="" style="display:none;" alt="Workspace">
      <div id="caption-box" class="caption-box"></div>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="input-row">
      <textarea id="text-input" placeholder="হাইলাইট করতে ব্র্যাকেট দিন: [PAMELA ANDERSON] SPENT MUCH OF..." oninput="renderText()"></textarea>
      <button class="btn" onclick="insertHighlight()" style="background:#00f0ff; color:#000; height:48px; font-weight:bold;">[সায়ান]</button>
    </div>
    
    <div class="control-row">
      <select id="font-select" onchange="setFont(this.value)">
        <option value="'Impact', 'Arial Black', sans-serif">Impact (ভিডিওর মতো বোল্ড)</option>
        <option value="'Montserrat', sans-serif">Montserrat Black</option>
        <option value="'Arial Black', sans-serif">Arial Black</option>
        <option value="system-ui, sans-serif">System Sans</option>
      </select>

      <label class="btn" style="white-space: nowrap; height:36px;">
        ➕ ফন্ট ফাইল <input type="file" id="font-input" accept=".ttf,.otf,.woff" onchange="loadCustomFont(event)">
      </label>

      <div class="slider-group">
        <span>সাইজ</span>
        <input type="range" id="font-size" min="12" max="32" value="18" oninput="setFontSize(this.value)">
      </div>
    </div>
  </div>

  <script>
    let cropper = null;
    let originalImageSrc = '';
    let currentImageSrc = '';

    const imageElement = document.getElementById('image');
    const captureArea = document.getElementById('capture-area');
    const captionBox = document.getElementById('caption-box');
    const textInput = document.getElementById('text-input');
    const fontSelect = document.getElementById('font-select');
    const saveTag = document.getElementById('save-tag');

    // লোকাল স্টোরেজ ও অটো-সেভ
    function saveState() {
      localStorage.setItem('editor_currImg', currentImageSrc);
      localStorage.setItem('editor_origImg', originalImageSrc);
      localStorage.setItem('editor_text', textInput.value);
      localStorage.setItem('editor_font', fontSelect.value);
      localStorage.setItem('editor_fontSize', document.getElementById('font-size').value);
      
      saveTag.style.display = 'block';
      setTimeout(() => { saveTag.style.display = 'none'; }, 900);
    }

    // অটো-রিস্টোর
    window.addEventListener('DOMContentLoaded', () => {
      const savedCurr = localStorage.getItem('editor_currImg');
      const savedOrig = localStorage.getItem('editor_origImg');
      const savedText = localStorage.getItem('editor_text') || 
        `[PAMELA ANDERSON] SPENT MUCH OF HER LIFE HIDING BEHIND MAKEUP, [FALSE LASHES], AND A CAREFULLY CREATED IMAGE. AT [59], SHE APPEARED ON A [RED CARPET] WITHOUT FOUNDATION...`;
      const savedFont = localStorage.getItem('editor_font') || "'Impact', 'Arial Black', sans-serif";
      const savedFontSize = localStorage.getItem('editor_fontSize') || '18';

      if (savedOrig) originalImageSrc = savedOrig;
      if (savedCurr) {
        currentImageSrc = savedCurr;
        loadImage(currentImageSrc, false);
      }

      textInput.value = savedText;
      fontSelect.value = savedFont;
      document.getElementById('font-size').value = savedFontSize;

      setFont(savedFont, false);
      setFontSize(savedFontSize, false);
      renderText(false);
      setupDrag();
    });

    // ছবি লোড
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        originalImageSrc = event.target.result;
        loadImage(originalImageSrc);
      };
      reader.readAsDataURL(file);
    });

    function loadImage(src, save = true) {
      currentImageSrc = src;
      imageElement.src = src;
      imageElement.style.display = 'block';

      if (cropper) {
        cropper.destroy();
        cropper = null;
        document.getElementById('crop-apply-btn').style.display = 'none';
      }

      if (save) saveState();
    }

    // ক্রপ ফিচার
    function startCrop(ratio) {
      if (!imageElement.src || imageElement.style.display === 'none') return;
      if (cropper) cropper.destroy();

      cropper = new Cropper(imageElement, {
        aspectRatio: ratio === 'free' ? NaN : ratio,
        viewMode: 1,
        autoCropArea: 0.95
      });
      document.getElementById('crop-apply-btn').style.display = 'inline-block';
    }

    function applyCrop() {
      if (!cropper) return;
      currentImageSrc = cropper.getCroppedCanvas().toDataURL();
      cropper.destroy();
      cropper = null;
      document.getElementById('crop-apply-btn').style.display = 'none';
      loadImage(currentImageSrc);
    }

    // ক্যাপশন টেক্সট রেন্ডারার
    function renderText(save = true) {
      const val = textInput.value;
      if (!val) {
        captionBox.innerHTML = '';
        if (save) saveState();
        return;
      }

      // [ব্র্যাকেট] থাকলে ভিডিওর মতো সায়ান কালার, বাকি সাদা
      let formatted = val.replace(/\[(.*?)\]/g, '<span class="c-cyan">$1</span>');
      formatted = formatted.replace(/([^\]\n]+)(?=\[|$)/g, function(match) {
        if (!match.trim()) return match;
        return '<span class="c-white">' + match + '</span>';
      });

      formatted = formatted.replace(/\n/g, '<br>');
      captionBox.innerHTML = formatted;
      if (save) saveState();
    }

    // হাইলাইট শর্টকাট
    function insertHighlight() {
      const start = textInput.selectionStart;
      const end = textInput.selectionEnd;
      const text = textInput.value;
      if (start !== end) {
        const selected = text.substring(start, end);
        textInput.value = text.substring(0, start) + '[' + selected + ']' + text.substring(end);
      } else {
        textInput.value += ' [HIGHLIGHT]';
      }
      renderText();
    }

    function setFont(fontName, save = true) {
      captionBox.style.fontFamily = fontName;
      if (save) saveState();
    }

    function setFontSize(size, save = true) {
      captionBox.style.fontSize = size + 'px';
      if (save) saveState();
    }

    // কাস্টম ফন্ট আপলোড
    function loadCustomFont(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'Font_' + Date.now();
      const reader = new FileReader();
      reader.onload = function(evt) {
        const font = new FontFace(fontName, evt.target.result);
        font.load().then(function(loaded) {
          document.fonts.add(loaded);
          setFont(fontName);
          const opt = document.createElement('option');
          opt.value = fontName;
          opt.innerText = file.name;
          opt.selected = true;
          fontSelect.appendChild(opt);
        });
      };
      reader.readAsArrayBuffer(file);
    }

    // টাচ বা মাউস দিয়ে টেক্সট ড্র্যাগ করে উপরে-নিচে সরানো
    function setupDrag() {
      let isDragging = false;
      let startY, startTop;

      function onStart(e) {
        isDragging = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startTop = captionBox.offsetTop;
      }

      function onMove(e) {
        if (!isDragging) return;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = clientY - startY;
        captionBox.style.top = (startTop + deltaY) + 'px';
      }

      function onEnd() { isDragging = false; }

      captionBox.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      captionBox.addEventListener('touchstart', onStart, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onEnd);
    }

    // এডিট করা ইমেজ সেভ/ডাউনলোড করা
    function saveAsImage() {
      if (!imageElement.src || imageElement.style.display === 'none') {
        alert("প্রথমে একটি ছবি নির্বাচন করুন!");
        return;
      }
      html2canvas(captureArea).then(canvas => {
        const link = document.createElement('a');
        link.download = 'edited-shorts.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function deleteImage() {
      imageElement.src = '';
      imageElement.style.display = 'none';
      currentImageSrc = '';
      if (cropper) cropper.destroy();
      saveState();
    }

    function clearAllData() {
      if (confirm("সব কিছু ক্লিয়ার করে নতুন করে শুরু করবেন?")) {
        deleteImage();
        textInput.value = '';
        renderText();
        localStorage.clear();
      }
    }
  </script>
</body>
</html>
