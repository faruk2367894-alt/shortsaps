<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Photo Text Editor</title>
  
  <!-- Cropper.js & Panzoom Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* টুলবার */
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: #1e1e1e; z-index: 10; justify-content: center; }
    button, label.btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    button:active, label.btn:active { background: #555; }
    input[type="file"] { display: none; }

    /* স্ট্যাটাস ইন্ডিকেটর */
    #save-status { position: absolute; top: 50px; right: 10px; font-size: 11px; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 12px; z-index: 20; color: #4caf50; display: none; }

    /* ওয়ার্কস্পেস */
    .workspace { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; touch-action: none; }
    #panzoom-container { display: inline-block; position: relative; }
    #image { max-width: 90vw; max-height: 70vh; display: block; }

    /* টেক্সট ওভারলে (কালো বক্স + হলুদ/সাদা টেক্সট) */
    .text-overlay {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      text-align: center;
      line-height: 1.4;
      pointer-events: auto;
    }
    .text-overlay span {
      background: #000;
      padding: 2px 6px;
      font-weight: 900;
      font-size: 18px;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .c-white { color: #ffffff; }
    .c-yellow { color: #ffd700; }

    /* কন্ট্রোল প্যানেল */
    .controls { padding: 10px; background: #1e1e1e; display: flex; flex-direction: column; gap: 8px; }
    .text-input-area { display: flex; gap: 6px; }
    input[type="text"], select { flex: 1; padding: 6px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="save-status">✓ সংরক্ষিত হয়েছে</div>

  <!-- শীর্ষ টুলবার -->
  <div class="toolbar">
    <label class="btn">📂 নতুন ইমেজ <input type="file" id="file-input" accept="image/*"></label>
    <button onclick="startCrop('free')">কাস্টম Crop</button>
    <button onclick="startCrop(9/16)">9:16 Crop</button>
    <button onclick="startCrop(1)">1:1 Crop</button>
    <button onclick="applyCrop()" id="crop-apply-btn" style="display:none; background:#2e7d32;">Apply Crop</button>
    <button onclick="deleteImage()">🗑️ ডিলিট</button>
    <button onclick="restoreImage()">↩️ রিস্টোর</button>
    <button onclick="resetZoom()">🔍 জুম রিসেট</button>
    <button onclick="clearAllData()" style="background:#b71c1c;">সব ক্লিয়ার</button>
  </div>

  <!-- ইমেজ ওয়ার্কস্পেস (Pinch-to-zoom সহ) -->
  <div class="workspace" id="workspace">
    <div id="panzoom-container">
      <img id="image" src="" style="display:none;" alt="Workspace Image">
      <div id="text-display" class="text-overlay"></div>
    </div>
  </div>

  <!-- টেক্সট ও ফন্ট কন্ট্রোল -->
  <div class="controls">
    <div class="text-input-area">
      <input type="text" id="text-input" placeholder="হাইলাইট করতে ব্র্যাকেট দিন: [HE GOT] HURT" oninput="updateText()">
      <button onclick="updateText()">সেট করুন</button>
    </div>
    <div style="display: flex; gap: 6px;">
      <select id="font-select" onchange="changeFont(this.value)">
        <option value="Impact">Impact (Heavy Bold)</option>
        <option value="Arial Black">Arial Black</option>
        <option value="Trebuchet MS">Trebuchet MS</option>
        <option value="sans-serif">System Sans-Serif</option>
        <option value="serif">System Serif</option>
        <option value="monospace">System Monospace</option>
      </select>
      <label class="btn" style="flex: 1; text-align: center;">
        ➕ নিজস্ব ফন্ট (.ttf/.otf) <input type="file" id="font-input" accept=".ttf,.otf,.woff,.woff2" onchange="loadCustomFont(event)">
      </label>
    </div>
  </div>

  <script>
    let cropper = null;
    let panzoomInstance = null;
    let originalImageSrc = '';
    let currentImageSrc = '';

    const imageElement = document.getElementById('image');
    const panzoomContainer = document.getElementById('panzoom-container');
    const textInputElement = document.getElementById('text-input');
    const fontSelectElement = document.getElementById('font-select');
    const saveStatusElement = document.getElementById('save-status');

    // --- অটো-সেভ ইঞ্জিন (IndexedDB দিয়ে হাই-কোয়ালিটি ইমেজ স্টোরেজ) ---
    const DB_NAME = 'PhotoEditorDB';
    const STORE_NAME = 'editorState';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore(STORE_NAME);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveToDB(key, val) {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(val, key);
      return tx.complete;
    }

    async function getFromDB(key) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    function showSaveIndicator() {
      saveStatusElement.style.display = 'block';
      setTimeout(() => { saveStatusElement.style.display = 'none'; }, 1500);
    }

    // প্রতিবার কাজ করার পর ডাটাবেসে সেভ হবে
    async function persistState() {
      await saveToDB('currentImage', currentImageSrc);
      await saveToDB('originalImage', originalImageSrc);
      localStorage.setItem('savedText', textInputElement.value);
      localStorage.setItem('savedFont', fontSelectElement.value);
      showSaveIndicator();
    }

    // অ্যাপে ঢুকলে আগের সংরক্ষিত অবস্থা ফিরিয়ে আনা (Restore on Startup)
    window.addEventListener('DOMContentLoaded', async () => {
      const savedCurr = await getFromDB('currentImage');
      const savedOrig = await getFromDB('originalImage');
      const savedText = localStorage.getItem('savedText') || '';
      const savedFont = localStorage.getItem('savedFont') || 'Impact';

      if (savedOrig) originalImageSrc = savedOrig;
      if (savedCurr) {
        currentImageSrc = savedCurr;
        loadImage(currentImageSrc, false);
      }

      if (savedText) {
        textInputElement.value = savedText;
        updateText(false);
      }

      if (savedFont) {
        fontSelectElement.value = savedFont;
        changeFont(savedFont, false);
      }
    });

    // ১. যেকোনো ফরম্যাটের ইমেজ ইনপুট নেওয়া
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        originalImageSrc = event.target.result;
        loadImage(originalImageSrc);
      };
      reader.readAsDataURL(file);
    });

    function loadImage(src, shouldSave = true) {
      currentImageSrc = src;
      imageElement.src = src;
      imageElement.style.display = 'block';

      if (cropper) {
        cropper.destroy();
        cropper = null;
        document.getElementById('crop-apply-btn').style.display = 'none';
      }

      // ৩. দুই আঙুলে জুম (Pinch to Zoom) চালু করা
      if (panzoomInstance) panzoomInstance.destroy();
      panzoomInstance = Panzoom(panzoomContainer, {
        maxScale: 6,
        minScale: 0.5,
        contain: 'outside'
      });
      panzoomContainer.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);

      if (shouldSave) persistState();
    }

    // ২. কাস্টম এবং ফিক্সড রেশিও ক্রপ
    function startCrop(aspectRatio) {
      if (!imageElement.src || imageElement.style.display === 'none') return;
      if (panzoomInstance) panzoomInstance.reset();
      if (cropper) cropper.destroy();

      cropper = new Cropper(imageElement, {
        aspectRatio: aspectRatio === 'free' ? NaN : aspectRatio,
        viewMode: 1,
        autoCropArea: 0.9,
      });
      document.getElementById('crop-apply-btn').style.display = 'inline-block';
    }

    function applyCrop() {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas();
      currentImageSrc = canvas.toDataURL();
      cropper.destroy();
      cropper = null;
      document.getElementById('crop-apply-btn').style.display = 'none';
      loadImage(currentImageSrc);
    }

    // ৪. ডিলিট, রিস্টোর ও অল ক্লিয়ার
    function deleteImage() {
      imageElement.src = '';
      imageElement.style.display = 'none';
      currentImageSrc = '';
      if (cropper) cropper.destroy();
      if (panzoomInstance) panzoomInstance.destroy();
      persistState();
    }

    function restoreImage() {
      if (originalImageSrc) {
        loadImage(originalImageSrc);
      }
    }

    async function clearAllData() {
      if (confirm("আপনি কি সব আগের ডাটা ক্লিয়ার করতে চান?")) {
        deleteImage();
        textInputElement.value = '';
        updateText();
        localStorage.clear();
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
      }
    }

    function resetZoom() {
      if (panzoomInstance) panzoomInstance.reset();
    }

    // ৫. ফন্ট পরিবর্তন
    function changeFont(fontName, shouldSave = true) {
      document.getElementById('text-display').style.fontFamily = fontName;
      if (shouldSave) persistState();
    }

    function loadCustomFont(event) {
      const file = event.target.files[0];
      if (!file) return;
      const fontName = 'CustomFont_' + Date.now();
      const reader = new FileReader();
      reader.onload = function(e) {
        const font = new FontFace(fontName, e.target.result);
        font.load().then(function(loadedFont) {
          document.fonts.add(loadedFont);
          changeFont(fontName);
          const option = document.createElement('option');
          option.value = fontName;
          option.innerText = file.name;
          option.selected = true;
          fontSelectElement.appendChild(option);
        });
      };
      reader.readAsArrayBuffer(file);
    }

    // টেক্সট রেন্ডারার ([শব্দ] দিলে হলুদ, বাকি সাদা)
    function updateText(shouldSave = true) {
      const text = textInputElement.value;
      const container = document.getElementById('text-display');
      
      const formatted = text.replace(/\[(.*?)\]/g, '<span class="c-yellow">$1</span>')
                            .replace(/([^\]]+)(?=\[|$)/g, function(m) {
                              if (m.trim() === '') return '';
                              return '<span class="c-white">' + m + '</span>';
                            });
      container.innerHTML = formatted;
      if (shouldSave) persistState();
    }
  </script>
</body>
</html>
