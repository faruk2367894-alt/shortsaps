<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobile Photo & Text Editor</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101010;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* মোবাইল টপ বার (হরিজন্টাল স্ক্রলযোগ্য) */
    .top-bar {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      background: #1a1a1a;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid #2d2d2d;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .top-bar::-webkit-scrollbar { display: none; }

    .btn {
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #444;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { background: #4a4a4a; }
    input[type="file"] { display: none; }

    /* অটো-সেভ টোস্ট */
    #save-tag {
      position: absolute;
      top: 55px;
      right: 12px;
      background: rgba(46, 125, 50, 0.9);
      color: #fff;
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 20px;
      display: none;
      z-index: 99;
      pointer-events: none;
    }

    /* ইমেজ ওয়ার্কস্পেস */
    .workspace {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      touch-action: none;
    }

    #panzoom-container {
      position: relative;
      display: inline-block;
    }

    #image {
      max-width: 95vw;
      max-height: 52vh;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    /* ভিডিওর মতো কালো বক্সে হলুদ ও সাদা টেক্সট */
    .caption-box {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      z-index: 15;
      line-height: 1.45;
      pointer-events: none;
    }
    
    .caption-box span {
      display: inline;
      background: #000;
      padding: 3px 7px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .caption-box span.c-white {
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .caption-box span.c-yellow {
      color: #ffd000;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    /* মোবাইল বটম কন্ট্রোল প্যানেল */
    .bottom-panel {
      background: #181818;
      border-top: 1px solid #2c2c2c;
      padding: 10px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      max-height: 42vh;
      overflow-y: auto;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    textarea {
      flex: 1;
      height: 44px;
      background: #252525;
      border: 1px solid #3d3d3d;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      resize: none;
    }
    textarea:focus { outline: none; border-color: #ffd000; }

    .control-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .control-row::-webkit-scrollbar { display: none; }

    select {
      flex: 1;
      min-width: 120px;
      background: #252525;
      color: #fff;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      padding: 6px;
      font-size: 12px;
      height: 34px;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #aaa;
    }
    input[type="range"] {
      width: 80px;
      accent-color: #ffd000;
    }
  </style>
</head>
<body>

  <div id="save-tag">✓ সংরক্ষিত</div>

  <div class="top-bar">
    <label class="btn">📂 ছবি আনুন <input type="file" id="file-input" accept="image/*"></label>
    <button class="btn" onclick="startCrop('free')">কাস্টম Crop</button>
    <button class="btn" onclick="startCrop(9/16)">9:16 Shorts</button>
    <button class="btn" onclick="startCrop(1)">1:1 স্কয়ার</button>
    <button class="btn" onclick="applyCrop()" id="crop-apply-btn" style="display:none; background:#2e7d32;">Apply Crop</button>
    <button class="btn" onclick="deleteImage()">🗑️ ডিলিট</button>
    <button class="btn" onclick="restoreImage()">↩️ রিস্টোর</button>
    <button class="btn" onclick="resetZoom()">🔍 রিসেট</button>
    <button class="btn" onclick="clearAllData()" style="background:#8b1b1b;">সব ক্লিয়ার</button>
  </div>

  <div class="workspace" id="workspace">
    <div id="panzoom-container">
      <img id="image" src="" style="display:none;" alt="Workspace">
      <div id="caption-box" class="caption-box"></div>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="input-row">
      <textarea id="text-input" placeholder="হলুদ করতে [ব্র্যাকেট] দিন: [HE GOT] HURT" oninput="renderText()"></textarea>
      <button class="btn" onclick="insertBracket()" style="background:#ffd000; color:#000; height:44px; font-weight:bold;">[হলুদ]</button>
    </div>
    
    <div class="control-row">
      <select id="font-select" onchange="setFont(this.value)">
        <option value="'Impact', 'Arial Black', sans-serif">Impact (Bold Shorts)</option>
        <option value="'Arial Black', sans-serif">Arial Black</option>
        <option value="system-ui, sans-serif">System Sans</option>
        <option value="serif">Classic Serif</option>
      </select>

      <label class="btn" style="white-space: nowrap; height:34px;">
        ➕ ফন্ট ফাইল <input type="file" id="font-input" accept=".ttf,.otf,.woff" onchange="loadCustomFont(event)">
      </label>

      <div class="slider-group">
        <span>সাইজ</span>
        <input type="range" id="font-size" min="14" max="36" value="20" oninput="setFontSize(this.value)">
      </div>
    </div>
  </div>

  <script>
    let cropper = null;
    let panzoomInstance = null;
    let originalImageSrc = '';
    let currentImageSrc = '';

    const imageElement = document.getElementById('image');
    const panzoomContainer = document.getElementById('panzoom-container');
    const captionBox = document.getElementById('caption-box');
    const textInput = document.getElementById('text-input');
    const fontSelect = document.getElementById('font-select');
    const saveTag = document.getElementById('save-tag');

    // ডাটাবেস (IndexedDB)
    const DB_NAME = 'PhotoEditorDB_v3';
    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => e.target.result.createObjectStore('state');
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function saveState() {
      const db = await openDB();
      const tx = db.transaction('state', 'readwrite');
      tx.objectStore('state').put(currentImageSrc, 'currImg');
      tx.objectStore('state').put(originalImageSrc, 'origImg');
      localStorage.setItem('savedText', textInput.value);
      localStorage.setItem('savedFont', fontSelect.value);
      localStorage.setItem('savedFontSize', document.getElementById('font-size').value);
      
      saveTag.style.display = 'block';
      setTimeout(() => { saveTag.style.display = 'none'; }, 900);
    }

    // অটো-রিস্টোর
    window.addEventListener('DOMContentLoaded', async () => {
      const db = await openDB();
      const tx = db.transaction('state', 'readonly');
      const store = tx.objectStore('state');
      
      const reqCurr = store.get('currImg');
      reqCurr.onsuccess = () => {
        if (reqCurr.result) {
          currentImageSrc = reqCurr.result;
          loadImage(currentImageSrc, false);
        }
      };

      const reqOrig = store.get('origImg');
      reqOrig.onsuccess = () => {
        if (reqOrig.result) originalImageSrc = reqOrig.result;
      };

      const savedText = localStorage.getItem('savedText') || '[HE GOT] HURT\nDAVID LEE ROTH RISKED EVERYTHING...';
      const savedFont = localStorage.getItem('savedFont') || "'Impact', 'Arial Black', sans-serif";
      const savedFontSize = localStorage.getItem('savedFontSize') || '20';

      textInput.value = savedText;
      fontSelect.value = savedFont;
      document.getElementById('font-size').value = savedFontSize;

      setFont(savedFont, false);
      setFontSize(savedFontSize, false);
      renderText(false);
    });

    // ইমেজ লোড
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        originalImageSrc = event.target.result;
        loadImage(originalImageSrc);
      };
      reader.readAsDataURL(file);
    });

    function loadImage(src, save = true) {
      currentImageSrc = src;
      imageElement.src = src;
      imageElement.style.display = 'block';

      if (cropper) {
        cropper.destroy();
        cropper = null;
        document.getElementById('crop-apply-btn').style.display = 'none';
      }

      // মোবাইলের জন্য দুই আঙুলে জুম
      if (panzoomInstance) panzoomInstance.destroy();
      panzoomInstance = Panzoom(panzoomContainer, {
        maxScale: 6,
        minScale: 0.6,
        contain: 'outside'
      });
      panzoomContainer.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);

      if (save) saveState();
    }

    // ক্রপ
    function startCrop(ratio) {
      if (!imageElement.src || imageElement.style.display === 'none') return;
      if (panzoomInstance) panzoomInstance.reset();
      if (cropper) cropper.destroy();

      cropper = new Cropper(imageElement, {
        aspectRatio: ratio === 'free' ? NaN : ratio,
        viewMode: 1,
        autoCropArea: 0.95
      });
      document.getElementById('crop-apply-btn').style.display = 'inline-block';
    }

    function applyCrop() {
      if (!cropper) return;
      currentImageSrc = cropper.getCroppedCanvas().toDataURL();
      cropper.destroy();
      cropper = null;
      document.getElementById('crop-apply-btn').style.display = 'none';
      loadImage(currentImageSrc);
    }

    // ডিলিট ও ক্লিয়ার
    function deleteImage() {
      imageElement.src = '';
      imageElement.style.display = 'none';
      currentImageSrc = '';
      if (cropper) cropper.destroy();
      if (panzoomInstance) panzoomInstance.destroy();
      saveState();
    }

    function restoreImage() {
      if (originalImageSrc) loadImage(originalImageSrc);
    }

    function resetZoom() {
      if (panzoomInstance) panzoomInstance.reset();
    }

    async function clearAllData() {
      if (confirm("সব ক্লিয়ার করে নতুন শুরু করতে চান?")) {
        deleteImage();
        textInput.value = '';
        renderText();
        localStorage.clear();
        const db = await openDB();
        db.transaction('state', 'readwrite').objectStore('state').clear();
      }
    }

    // টেক্সট রেন্ডার
    function renderText(save = true) {
      const val = textInput.value;
      if (!val) {
        captionBox.innerHTML = '';
        if (save) saveState();
        return;
      }

      let formatted = val.replace(/\[(.*?)\]/g, '<span class="c-yellow">$1</span>');
      formatted = formatted.replace(/([^\]\n]+)(?=\[|$)/g, function(match) {
        if (!match.trim()) return match;
        return '<span class="c-white">' + match + '</span>';
      });

      formatted = formatted.replace(/\n/g, '<br>');
      captionBox.innerHTML = formatted;
      if (save) saveState();
    }

    // হলুদ করার কুইক বাটন
    function insertBracket() {
      const start = textInput.selectionStart;
      const end = textInput.selectionEnd;
      const text = textInput.value;
      if (start !== end) {
        const selected = text.substring(start, end);
        textInput.value = text.substring(0, start) + '[' + selected + ']' + text.substring(end);
      } else {
        textInput.value += ' [HE GOT]';
      }
      renderText();
    }

    function setFont(fontName, save = true) {
      captionBox.style.fontFamily = fontName;
      if (save) saveState();
    }

    function setFontSize(size, save = true) {
      captionBox.style.fontSize = size + 'px';
      if (save) saveState();
    }

    function loadCustomFont(e) {
      const file = e.target.files[0];
      if (!file) return;
      const fontName = 'Font_' + Date.now();
      const reader = new FileReader();
      reader.onload = function(evt) {
        const font = new FontFace(fontName, evt.target.result);
        font.load().then(function(loaded) {
          document.fonts.add(loaded);
          setFont(fontName);
          const opt = document.createElement('option');
          opt.value = fontName;
          opt.innerText = file.name;
          opt.selected = true;
          fontSelect.appendChild(opt);
        });
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
